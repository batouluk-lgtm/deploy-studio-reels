<script>
window.READY = false;
window.SFX = [];
const sfx = (t, k, g = 1) => SFX.push({ t, k, g });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);
const mix = (a, b, p) => a + (b - a) * p;
const V = (x, y, z) => [x, y, z];
const vmix = (a, b, p) => a.map((v, i) => mix(v, b[i], p));
const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l) };

// ================= GL =================
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const FLOAT = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const SW = 405, SH = 720, BW = 270, BH = 480;

const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv=p*.5+.5; gl_Position=vec4(p,0,1); }`;

const SCENE = `#version 300 es
precision highp float;
in vec2 uv; out vec4 O;
uniform vec2 uR; uniform float uT, uST; uniform int uS;
uniform vec3 uRo, uTa; uniform float uFov, uRoll;
uniform vec3 uChar; uniform float uArm, uYaw, uHead, uH;
uniform vec3 uKeyDir, uKeyCol, uAmb, uPL, uPLCol, uFogCol; uniform float uFog;
uniform float uFocus, uAper;

vec3 gLoc; vec3 gHead;
float box(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float hash3(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }
vec2 U(vec2 a, vec2 b){ return a.x<b.x?a:b; }

// materials: 1 wood 2 cash 3 suit 4 legs 5 skin 6 cap 7 wall 8 building 9 cloud 10 ground 13 phone 14 lamp 15 pole
vec2 hero(vec3 p){
  vec3 q=p-uChar; q.xz=rot(uYaw)*q.xz;
  if(length(q-vec3(0,1.1,0))>1.9) return vec2(length(q-vec3(0,1.1,0))-1.8,0.);
  vec2 r=vec2(1e9,0.);
  r=U(r,vec2(box(q-vec3(.14,.42,0),vec3(.11,.42,.12)),4.));
  r=U(r,vec2(box(q-vec3(-.14,.42,0),vec3(.11,.42,.12)),4.));
  r=U(r,vec2(box(q-vec3(0,1.12,0),vec3(.32,.3,.17)),3.));
  for(int s=0;s<2;s++){ float sg=s==0?1.:-1.; vec3 a=q-vec3(.43*sg,1.38,0.);
    a.xy=rot(sg*mix(.08,2.6,uArm))*a.xy; r=U(r,vec2(box(a-vec3(0,-.3,0),vec3(.09,.31,.09)),3.)); }
  vec3 h=q-vec3(0,1.72,0); h.xz=rot(uHead)*h.xz; gHead=h;
  r=U(r,vec2(box(h,vec3(.26)),5.));
  r=U(r,vec2(box(h-vec3(0,.2,.03),vec3(.272,.075,.25)),16.));
  r=U(r,vec2(box(h-vec3(0,.28,0),vec3(.28,.06,.28)),6.));
  r=U(r,vec2(box(h-vec3(0,.245,-.36),vec3(.28,.022,.13)),6.));
  return r;
}
vec2 cashBox(vec3 p, vec3 c, vec3 b, float ang){ vec3 q=p-c; q.xz=rot(ang)*q.xz; float d=box(q,b); if(d<.002) gLoc=q/b; return vec2(d,2.); }

vec2 table(vec3 p){
  vec2 r=vec2(box(p-vec3(0,.76,.2),vec3(1.4,.04,.8)),1.);
  r=U(r,vec2(p.y,10.));
  r=U(r,vec2(3.2-p.z,7.));
  r=U(r,vec2(length(p-uPL)-.07,14.));
  return r;
}
vec2 map(vec3 p){
  vec2 r=vec2(1e9,0.);
  if(uS==0){
    r=U(r,vec2(2.4-p.z,7.)); r=U(r,vec2(p.y,10.));
    r=U(r,hero(p));
  } else if(uS<=4){
    r=table(p);
    if(uS==1){ r=U(r,cashBox(p,vec3(0,.8006,0),vec3(.0775,.0006,.0345),.35)); }
    if(uS==2){ for(int i=0;i<13;i++){ float fi=float(i); float a=-.9+fi*.15*uH;
      r=U(r,cashBox(p,vec3(-.06,.8006+fi*.0012,0)+vec3(cos(a+1.57)*.0,0,0),vec3(.0775,.0005,.0345),a)); } }
    if(uS==3){ r=U(r,cashBox(p,vec3(0,.81,0),vec3(.0775,.01,.0345),.25)); r=U(r,cashBox(p,vec3(.01,.83,.005),vec3(.0775,.01,.0345),.05)); r=U(r,hero(p)); }
    if(uS==4){ float h=.165*uH; r=U(r,cashBox(p,vec3(0,.8+h,0),vec3(.0775,h,.0345),.2)); r=U(r,hero(p)); }
  } else if(uS==5){
    r=U(r,vec2(p.y,10.));
    r=U(r,cashBox(p,vec3(0,uH*.5,0),vec3(.62,uH*.5,.62),.0));
    vec3 q=p; q.x=abs(q.x);
    r=U(r,vec2(box(q-vec3(15.,7.5,8.),vec3(5.,7.5,30.)),8.));
    vec3 lp=p-vec3(5.5,0,-6.); r=U(r,vec2(box(lp-vec3(0,2.6,0),vec3(.06,2.6,.06)),15.));
    r=U(r,vec2(length(lp-vec3(-.3,5.2,0))-.16,14.));
    r=U(r,hero(p));
  } else if(uS==6){
    r=U(r,cashBox(p,vec3(0,-300.,0),vec3(.62,300.,.62),.0));
    float h=-30.+fbm(p.xz*.035+vec2(uT*.02,0.))*16.;
    r=U(r,vec2((p.y-h)*.55,9.));
    r=U(r,hero(p));
  } else {
    r=U(r,cashBox(p,vec3(0,-400.,0),vec3(.62,400.,.62),.0));
    r=U(r,hero(p));
  }
  return r;
}
vec3 nor(vec3 p){ vec2 e=vec2(.0007,0); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float soft(vec3 ro, vec3 rd){ float r=1.,t=.01; for(int i=0;i<14;i++){ float h=map(ro+rd*t).x; r=min(r,10.*h/t); t+=clamp(h,.01,.6); if(h<.0005||t>30.) break; } return clamp(r,0.,1.); }
float ao(vec3 p, vec3 n){ float o=0.,s=1.; for(int i=1;i<5;i++){ float h=.02*float(i)*float(i); o+=(h-map(p+n*h).x)*s; s*=.6; } return clamp(1.-2.*o,0.,1.); }

float stars(vec3 rd){ vec3 a=abs(rd); vec2 c= a.x>a.y&&a.x>a.z? rd.yz/a.x : a.y>a.z? rd.xz/a.y : rd.xy/a.z;
  vec2 g=floor(c*260.); float h=hash(g+sign(rd.x)*3.+sign(rd.y)*7.); vec2 f=fract(c*260.)-.5;
  return step(.994,h)*smoothstep(.35,0.,length(f))*(.5+.5*hash(g+1.)); }
float sphere(vec3 ro, vec3 rd, vec3 c, float r){ vec3 oc=ro-c; float b=dot(oc,rd), k=dot(oc,oc)-r*r, h=b*b-k; if(h<0.) return -1.; return -b-sqrt(h); }

vec3 sky(vec3 rd){
  if(uS<=4) return uFogCol;
  if(uS==5){ vec3 c=mix(vec3(.02,.03,.06),vec3(.07,.09,.16),clamp(1.-rd.y,0.,1.)); return c+stars(rd)*.6*smoothstep(.1,.4,rd.y); }
  if(uS==6){ vec3 sd=uKeyDir; float s=max(dot(rd,sd),0.);
    vec3 c=mix(vec3(1.,.62,.38),vec3(.25,.42,.75),smoothstep(-.05,.45,rd.y));
    c+=vec3(1.,.7,.4)*pow(s,8.)*.8+vec3(1.,.9,.7)*pow(s,400.)*8.; return c; }
  vec3 c=vec3(0)+stars(rd)*1.2;
  vec3 sd=uKeyDir; c+=vec3(1.,.95,.85)*pow(max(dot(rd,sd),0.),600.)*20.+vec3(.4,.5,.8)*pow(max(dot(rd,sd),0.),20.)*.15;
  if(uS==7){ // earth below, km units
    float R=6371., alt=2600.; vec3 C=vec3(0,-(R+alt),0); vec3 o=vec3(0);
    float t=sphere(o,rd,C,R);
    vec3 oc=o-C; float b=dot(oc,rd); float dmin=sqrt(max(dot(oc,oc)-b*b,0.));
    float halo=smoothstep(R*1.06,R,dmin)*step(0.,-b); c+=vec3(.3,.55,1.)*halo*.9;
    if(t>0.){ vec3 p=o+rd*t, n=normalize(p-C);
      vec2 sp=vec2(atan(n.z,n.x)+uT*.01,acos(n.y))*vec2(3.,3.);
      float land=smoothstep(.52,.56,fbm(sp*2.));
      vec3 alb=mix(vec3(.03,.12,.35),vec3(.12,.32,.12),land);
      float cl=smoothstep(.55,.75,fbm(sp*3.5+vec2(5.,1.)));
      alb=mix(alb,vec3(.9),cl*.8);
      float dif=max(dot(n,sd),0.);
      c=alb*(dif*1.6+.02)+vec3(.3,.55,1.)*pow(1.-max(dot(n,-rd),0.),3.)*.8*(.2+dif);
    }
  } else { // moon behind
    vec3 mc=normalize(vec3(-.3,.16,1.))*1000.; float t=sphere(vec3(0),rd,mc,190.);
    c+=vec3(.6,.7,1.)*.25*smoothstep(260.,190.,length(cross(rd,mc)));
    if(t>0.){ vec3 n=normalize(rd*t-mc); vec2 sp=n.xy*3.;
      float cr=fbm(sp*2.)*.6+fbm(sp*7.)*.4; vec3 alb=vec3(.75)*mix(.6,1.05,cr);
      c=alb*(max(dot(n,normalize(vec3(.8,.4,-.5))),0.)*1.4+.05); }
  }
  return c;
}

vec3 matCol(float m, vec3 p, vec3 n, out vec3 emis){
  emis=vec3(0);
  if(m==1.){ float g=fbm(vec2(p.x*12.,p.z*2.)); return mix(vec3(.25,.13,.06),vec3(.42,.24,.12),g); }
  if(m==2.){ vec3 q=gLoc; vec3 a=vec3(.20,.42,.22); float band=1.-step(.13,abs(q.x));
    float lines = uS>=4 ? step(.85,fract((p.y)*(uS>=5?3.:60.))) : 0.;
    vec3 c=mix(a,a*.55,lines*.8);
    if(uS<=2){ c=mix(vec3(.30,.55,.36),vec3(.55,.7,.5),smoothstep(.4,.2,length(q.xz*vec2(1.,1.)))*.6); c=mix(c,vec3(.85,.88,.8),step(.82,abs(q.x))*.6); }
    else c=mix(c,vec3(.92,.9,.82),band*(uS>=5?.0:1.));
    if(uS>=5){ c=mix(c,vec3(.85,.85,.78),step(.94,fract(p.y*.35))*.7); }
    return c; }
  if(m==3.){ vec3 c=vec3(.10,.22,.62); if(n.z<-.5&&abs(p.x-uChar.x)<.02) c=vec3(.9); return c; }
  if(m==4.) return vec3(.05,.07,.16);
  if(m==5.){ vec3 h=gHead; vec3 c=vec3(.74,.48,.31)*(.9+.1*hash(floor(h.xy*28.)+floor(h.z*28.)));
    if(h.z<-.24){ vec2 f=h.xy; float ax=abs(f.x);
      if(abs(ax-.1)<.052&&abs(f.y-.02)<.042) c=vec3(.93,.92,.88);
      if(abs(ax-.088)<.024&&abs(f.y-.012)<.03) c=vec3(.03,.03,.04);
      if(abs(f.y-.1)<.016&&abs(ax-.1)<.062) c=vec3(.13,.07,.04);
      if(ax<.075&&abs(f.y+.12)<.016) c=vec3(.32,.09,.07);
      if(ax<.03&&abs(f.y+.04)<.03) c*=.82; }
    return c; }
  if(m==16.) return vec3(.11,.065,.035);
  if(m==6.) return vec3(.62,.86,.12);
  if(m==7.){ vec3 c=vec3(.05,.05,.06); if(uS==0&&abs(p.x+.9)<.6&&abs(p.y-1.7)<.7){ emis=vec3(.08,.14,.35)*(1.-step(.97,fract(p.x*1.5+.5))); } return c; }
  if(m==8.){ vec3 c=vec3(.10,.10,.11); if(abs(n.x)>.5){ vec2 g=vec2(p.z/1.8,p.y/3.); vec2 f=fract(g); vec2 id=floor(g);
      if(f.x>.25&&f.x<.75&&f.y>.3&&f.y<.75&&p.y>1.&&p.y<14.6){ float on=step(.55,hash(id)); emis=mix(vec3(.02,.03,.05),vec3(1.,.7,.35)*1.4,on); c=vec3(.02);} } return c; }
  if(m==9.) return vec3(1.);
  if(m==10.) return uS==5? vec3(.05,.05,.055) : vec3(.04,.035,.03);
  if(m==13.){ emis=vec3(.6,.8,1.)*.9; return vec3(.02); }
  if(m==14.){ emis=uS==5? vec3(1.,.55,.2)*6. : vec3(1.,.75,.45)*6.; return vec3(0); }
  if(m==15.) return vec3(.08);
  return vec3(.5);
}

void main(){
  vec2 q=(uv*2.-1.)*vec2(uR.x/uR.y,1.);
  vec3 ww=normalize(uTa-uRo), uu=normalize(cross(vec3(sin(uRoll),cos(uRoll),0),ww)), vv=cross(ww,uu);
  vec3 rd=normalize(q.x*uu+q.y*vv+(1./tan(radians(uFov)*.5))*ww), ro=uRo;
  float t=0.; vec2 h; bool hit=false; float tmax= uS>=5? 400. : 30.;
  for(int i=0;i<90;i++){ h=map(ro+rd*t); if(h.x<.0004*t+.0002){ hit=true; break; } t+=h.x; if(t>tmax) break; }
  vec3 col; float depth=1e4;
  if(hit){
    vec3 p=ro+rd*t; map(p); vec3 n=nor(p); vec3 emis;
    vec3 alb=matCol(h.y,p,n,emis);
    float sh=soft(p+n*.012,uKeyDir); float dif=max(dot(n,uKeyDir),0.);
    vec3 pl=uPL-p; float dl=length(pl); vec3 ld=pl/dl; float pd=max(dot(n,ld),0.)/(1.+dl*dl*1.2);
    float o=ao(p,n);
    float sp=pow(max(dot(reflect(rd,n),uKeyDir),0.),32.)*(h.y==2.?.15:.3);
    if(h.y==9.){ float sss=.6+.4*dif; alb=vec3(1.)*sss; col=alb*uKeyCol*.7*(.4+.6*sh)+uAmb*.9*(.5+.5*n.y); }
    else col=alb*(uKeyCol*dif*sh+uPLCol*pd+uAmb*o*(.55+.45*n.y))+uKeyCol*sp*sh+emis;
    col+=uKeyCol*.06*pow(1.-max(dot(n,-rd),0.),3.)*alb; // rim
    depth=t;
    col=mix(col,uFogCol,1.-exp(-uFog*t));
  } else col=sky(rd);
  float coc = uAper*abs(depth-uFocus)/max(depth,.001)*min(1.,uFocus);
  O=vec4(col, clamp(coc,0.,1.));
}`;

const BRIGHT = `#version 300 es
precision highp float; in vec2 uv; out vec4 O; uniform sampler2D A; uniform float uThr;
void main(){ vec3 c=texture(A,uv).rgb; float l=max(c.r,max(c.g,c.b)); O=vec4(c*smoothstep(uThr,uThr+.6,l),1.); }`;
const COPY = `#version 300 es
precision highp float; in vec2 uv; out vec4 O; uniform sampler2D A;
void main(){ O=texture(A,uv); }`;
const BLUR = `#version 300 es
precision highp float; in vec2 uv; out vec4 O; uniform sampler2D A; uniform vec2 uD;
void main(){ vec4 s=texture(A,uv)*.227; vec2 o1=uD*1.385, o2=uD*3.231;
  s+=(texture(A,uv+o1)+texture(A,uv-o1))*.316; s+=(texture(A,uv+o2)+texture(A,uv-o2))*.07; O=s; }`;
const COMP = `#version 300 es
precision highp float; in vec2 uv; out vec4 O;
uniform sampler2D A, D, B; uniform float uExp, uBloom, uFlash, uCA, uGrain, uT, uVig; uniform vec2 uBlur;
vec3 base(vec2 p){ vec4 a=texture(A,p); vec3 d=texture(D,p).rgb; return mix(a.rgb,d,smoothstep(0.,.5,a.a)); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 c=uv-.5; vec3 col=vec3(0);
  for(int i=0;i<10;i++){ float k=float(i)/9.-.5; vec2 p=uv+uBlur*k;
    vec2 off=c*uCA*.012;
    col+=vec3(base(p+off).r, base(p).g, base(p-off).b); }
  col/=10.;
  col+=texture(B,uv).rgb*uBloom;
  col*=uExp; col+=vec3(uFlash);
  col=aces(col);
  col*=1.-uVig*dot(c*vec2(1.,.75),c*vec2(1.,.75))*2.2;
  col=pow(col,vec3(1./2.2));
  col+= (h(uv*vec2(1080.,1920.)+fract(uT*7.3)*100.)-.5)*uGrain;
  col=mix(col, col*vec3(1.03,1.,.95), .5);
  O=vec4(col,1.);
}`;

function compile(fs) {
  const mk = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name) }
  return { p, u };
}
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function target(w, h) {
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);

  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const P = { scene: compile(SCENE), bright: compile(BRIGHT), copy: compile(COPY), blur: compile(BLUR), comp: compile(COMP) };

  pass(P.blur, dst, u => { tex(u, 'A', tmp, 0); gl.uniform2f(u.uD, 0, r / BH) });

const ROLL = .7;

function sceneAt(t) { let i = 0; for (let k = 0; k < START.length; k++) if (t >= START[k]) i = k; return i }

// camera + lighting per scene

  } else if (S <= 4) {

    Object.assign(c, { pl: lamp, plc: V(1.5, 1.0, .55).map(x => x * 1.4), key: norm([-.35, .65, -.6]), kc: V(1.1, .78, .45).map(x => x * .9),

    if (S === 2) { const a = mix(-.75, -.2, e); Object.assign(c, { H: eo(lin(lt, 0, ROLL + .3)), ro: V(Math.sin(a) * .34, .93, -Math.cos(a) * .34), ta: V(-.03, .8, 0), fov: 32, focus: .36, aper: 1.6 }) }
    if (S === 3) Object.assign(c, { ch: V(0, 0, .95), arm: .35 + .25 * cheer, ro: V(mix(-.12, .05, e), .9, mix(-.42, -.36, e)), ta: V(0, .86, .1), fov: 38, focus: .45, aper: 1.4, head: .0 });
    if (S === 4) Object.assign(c, { key: norm([-.35, .65, -.6]), kc: V(1.0, .75, .48), ch: V(.05, 0, .9), H: eo(lin(lt, 0, ROLL + .4)), arm: .4 + .6 * Math.abs(Math.sin(lt * 5)) * lin(lt, .5, 1), ro: V(mix(-.5, -.35, e), mix(.86, 1.0, e), -.62), ta: V(0, mix(.95, 1.15, e), .2), fov: 40, focus: .72, aper: 1.1 });
  } else if (S === 5) {
    const H = 21;
    Object.assign(c, { H, ch: V(0, H, 0), arm: .9 * Math.abs(Math.sin(lt * 4)), ro: V(mix(7, 5, e), 1.5, -17), ta: V(0, mix(6, 21.5, eio(lin(u, .05, .8))), 0), fov: 52, roll: mix(.1, -.05, e),
      key: norm([-.3, .8, -.25]), kc: V(.18, .22, .38), amb: V(.03, .04, .07), pl: V(5.2, 5.2, -6), plc: V(1.6, .8, .3).map(x => x * 9), fog: V(.025, .035, .07), fd: .018, focus: 25, aper: 0, bloom: 1.2, thr: .7 });

      key: norm([1, .12, .5]), kc: V(1.35, .95, .65), amb: V(.2, .24, .36).map(x => x * .7), fog: V(1., .68, .5), fd: .0035, focus: 6.5, aper: .25, bloom: 1.1, thr: .9 });

// ================= SOUND =================
sfx(0, 'drone4', .9); sfx(.35, 'buzz', .7); sfx(1.6, 'buzz', .5);
sfx(START[1] - .45, 'swell', .7);
START.forEach((s, i) => {

// ================= HUD =================
const $ = id => document.getElementById(id);
const fmt = v => Math.round(v).toLocaleString('ru-RU').replace(/ /g, ' ') + ' ₽';

window.render = function (t) {
  const out = t >= OUT;
  $('out').style.display = out ? 'block' : 'none';
  if (out) {
    const k = t - OUT;
    [['.ic', 0, .6], ['.q', .25, .6], ['.q2', .5, .6], ['.br', .9, .6], ['.br2', 1.0, .6]].forEach(([s, a, d]) => {

    });

  }

  const toEnd = D - lt;

  const whip = Math.max(whipOut, whipIn);

  // ---- scene pass

    gl.uniform2f(u.uR, SW, SH); gl.uniform1f(u.uT, t); gl.uniform1f(u.uST, lt); gl.uniform1i(u.uS, S);

    gl.uniform3fv(u.uChar, c.ch); gl.uniform1f(u.uArm, c.arm); gl.uniform1f(u.uYaw, c.yaw); gl.uniform1f(u.uHead, c.head); gl.uniform1f(u.uH, c.H);
    gl.uniform3fv(u.uKeyDir, c.key); gl.uniform3fv(u.uKeyCol, c.kc); gl.uniform3fv(u.uAmb, c.amb); gl.uniform3fv(u.uPL, c.pl); gl.uniform3fv(u.uPLCol, c.plc);
    gl.uniform3fv(u.uFogCol, c.fog); gl.uniform1f(u.uFog, c.fd); gl.uniform1f(u.uFocus, c.focus); gl.uniform1f(u.uAper, c.aper);

    gl.uniform1f(u.uCA, 1 + whip * 6 + land * 4); gl.uniform1f(u.uGrain, .06); gl.uniform1f(u.uT, t); gl.uniform1f(u.uVig, .9);

  const showHud = S > 0;

    const v = pv.v * Math.pow(st.v / pv.v, p);

    $('num').style.color = p < 1 ? '#C6F432' : '#F4F1EA';
    $('lbl').textContent = 'ЗАРПЛАТА · ДЕНЬ ' + Math.round(mix(pv.d, st.d, p));

    $('say').style.transform = `translateY(${(1 - eo(lin(lt, s0, s0 + .35))) * 20}px)`;

  }
};
render(0); window.READY = true;
