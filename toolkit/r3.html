<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Ролик 3</title>
<link rel="stylesheet" href="lib/ds.css">
<style>
#hook{position:absolute;left:70px;right:70px;top:620px}
#hook .ln{font-family:"Inter Display";font-weight:800;font-size:150px;line-height:.98;letter-spacing:-.04em}
#hook .w{display:inline-block;margin-right:.18em;opacity:0}
#hook .big{font-size:196px;color:var(--lime);letter-spacing:-.045em}
#sChat .phone{left:220px;top:470px;transform:scale(.92)}
#cap3{top:270px}
.unread{position:absolute;left:36px;top:430px;font-size:24px;color:var(--muted);display:flex;gap:12px;align-items:center}
.unread i{width:12px;height:12px;border-radius:50%;background:var(--red);display:inline-block}
#moon{position:absolute;right:60px;top:300px}
#cal{position:absolute;left:340px;top:430px}
#lost{position:absolute;left:70px;right:70px;top:1000px;text-align:center}
#lost .a{font-family:"Inter Display";font-weight:800;font-size:96px;line-height:1.02;letter-spacing:-.035em}
#sFlow .phone{left:220px;top:470px}
#timer{position:absolute;left:770px;top:440px;z-index:30;height:96px;padding:0 30px;border-radius:48px;background:var(--lime);color:var(--ink);display:flex;align-items:center;gap:14px;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#timer .dot{width:18px;height:18px;border-radius:50%;background:var(--red)}
#capF{top:270px}
#sTg .lock{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#232A12,#0F1115 60%)}
#clock{position:absolute;left:0;right:0;top:330px;text-align:center}
#clock .h{font-family:"Inter Display";font-weight:700;font-size:200px;letter-spacing:-.04em}
#clock .d{font-size:40px;color:var(--muted);margin-top:-10px}
#capT{top:1180px}
#steps{position:absolute;left:70px;right:70px;top:420px}
#steps h2{font-family:"Inter Display";font-weight:800;font-size:92px;letter-spacing:-.035em;margin-bottom:56px;line-height:1}
.st{display:flex;align-items:center;gap:36px;padding:38px 40px;border-radius:40px;background:var(--panel);border:2px solid var(--line);margin-bottom:26px;font-size:54px;font-weight:700;letter-spacing:-.02em}
.st .n{flex:0 0 110px;height:110px;border-radius:32px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Inter Display";font-size:64px;font-weight:900}
</style></head><body><div class="stage">

<div class="scene" id="sHook">
  <div id="hook"><div class="ln"><span class="w" id="w0">Ты</span><span class="w" id="w1">теряешь</span><span class="w" id="w2">клиентов,</span></div>
  <div class="ln"><span class="w big" id="w3">ПОКА</span><span class="w big" id="w4">СПИШЬ</span></div></div>
</div>

<div class="scene" id="sChat" style="display:none">
  <div class="dots"></div>
  <svg id="moon" width="120" height="120" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#C6F432"/></svg>
  <div class="cap" id="cap3">Он написал <span class="lime">в 23:47</span></div>
  <div id="chatPh"></div>
</div>

<div class="scene" id="sLost" style="display:none">
  <svg id="cal" width="400" height="400" viewBox="0 0 100 100">
    <rect x="12" y="20" width="76" height="68" rx="10" fill="none" stroke="#F4F4F0" stroke-width="5"/>
    <path d="M12 38h76M32 12v16M68 12v16" stroke="#F4F4F0" stroke-width="5" stroke-linecap="round"/>
    <g fill="#F4F4F0"><rect x="24" y="48" width="12" height="10" rx="2"/><rect x="44" y="48" width="12" height="10" rx="2"/><rect x="64" y="48" width="12" height="10" rx="2"/><rect x="24" y="66" width="12" height="10" rx="2"/><rect x="44" y="66" width="12" height="10" rx="2"/></g>
    <path id="xline" d="M6 94L94 6" stroke="#FF5A5A" stroke-width="8" stroke-linecap="round" stroke-dasharray="125" stroke-dashoffset="125"/>
  </svg>
  <div id="lost"><div class="a" id="l1">Утром он уже</div><div class="a" id="l2">записан <span style="color:var(--red)">к другому</span></div></div>
</div>

<div class="scene" id="sFlow" style="display:none">
  <div class="dots"></div><div class="glow" style="left:-110px;top:500px"></div>
  <div class="cap" id="capF">А мог записаться сам.<br><span class="lime">За 30 секунд</span></div>
  <div id="flowPh"></div>
  <div id="timer"><span class="dot"></span><span id="tm">0:00</span></div>
</div>

<div class="scene" id="sTg" style="display:none">
  <div class="lock"></div>
  <div id="clock"><div class="h">07:30</div><div class="d">пятница, 13 ноября</div></div>
  <div id="tgw"></div>
  <div class="cap" id="capT">Ты узнаёшь утром<br><span class="lime">из Telegram</span></div>
</div>

<div class="scene" id="sSteps" style="display:none">
  <div class="dots"></div><div class="glow" style="left:-110px;top:400px"></div>
  <div id="steps"><h2 id="sh">Как получить<br>демо</h2>
   <div class="st" id="st1"><div class="n">1</div>Сохрани рилс</div>
   <div class="st" id="st2"><div class="n">2</div><span>Напиши <span class="lime">ДЕМО</span></span></div>
   <div class="st" id="st3"><div class="n">3</div><span>Получи демо<br>под свою нишу</span></div></div>
</div>

<div id="endwrap"></div>
</div>
<script src="lib/ds.js"></script>
<script>
window.DUR = 24; window.BPM = 120;
window.MUSIC = { drums_from: 2, drums_to: 24, breaks: [[6, 7]], fade_out: .5 };

$('chatPh').innerHTML = phone('C', `<div class="chat"><div class="hd"><div class="av"></div><div><div class="who">Клиент</div><div class="stt">был(а) в 23:47</div></div></div>
  <div class="bub" id="b1" style="left:36px;top:260px">а есть окошко на завтра?<span class="tm">23:47</span></div>
  <div class="unread" id="ur"><i></i><span id="urt">не прочитано</span></div></div>`, { time: '23:47' });
$('flowPh').innerHTML = phone('F', bookingPages('k', { slot: '10:00' }), { time: '23:48' });
$('tgw').innerHTML = tgCard('tg', 680, 'Новая запись', 'Полировка кузова<br>завтра · 10:00');
$('endwrap').innerHTML = endCard('end');

// sound
[0, .25, .5, 1.0, 1.25].forEach((t, i) => sfx(t, i < 3 ? 'hit' : 'hit', i < 3 ? .55 : .9));
sfx(2, 'swipe', .5); sfx(2.4, 'ping', .55);
for (let i = 0; i < 12; i++) sfx(3.0 + i * .25, 'tick', .6);
sfx(5.6, 'riser', .4);
sfx(6, 'error', .8); sfx(6.15, 'hit', .7);
sfx(9, 'whoosh', .45);
const flow = bookingFlow('F', 'k', 9.4, 1.05);
sfx(17, 'swipe', .4); sfx(17.15, 'ping', .8); sfx(17.2, 'tap', .4);
sfx(20, 'swipe', .45); [20.3, 20.8, 21.3].forEach(t => sfx(t, 'pop', .6));
endSfx(22);

const pad = n => String(n).padStart(2, '0');
window.render = function (t) {
  vis('sHook', t < 2); vis('sChat', on(t, 2, 6)); vis('sLost', on(t, 6, 9)); vis('sFlow', on(t, 9, 17)); vis('sTg', on(t, 17, 20)); vis('sSteps', on(t, 20, 22));

  if (t < 2) {
    [0, .25, .5, 1.0, 1.25].forEach((t0, i) => { const p = back(lin(t, t0, t0 + .22)); const w = $('w' + i); w.style.opacity = t >= t0 ? 1 : 0; w.style.transform = `scale(${mix(1.35, 1, p)})` });
    $('hook').style.transform = `scale(${1 + .03 * lin(t, 0, 2)})`;
  }
  if (on(t, 2, 6)) {
    rise('cap3', t, 2.05, 40, .35);
    const C = $('C'); C.style.transform = `scale(.92) translateY(${(1 - eo(lin(t, 2, 2.35))) * 200}px)`;
    pop('b1', t, 2.4, .4, .7);
    // clock runs through the night
    const m = Math.round(mix(23 * 60 + 47, 24 * 60 + 7 * 60 + 30, eio(lin(t, 3.0, 5.8))));
    const hh = Math.floor(m / 60) % 24, mm = m % 60;
    $('C_clock').textContent = `${pad(hh)}:${pad(mm)}`;
    const el = m - (23 * 60 + 47);
    $('urt').textContent = el < 1 ? 'не прочитано' : `не прочитано · ${Math.floor(el / 60)} ч ${pad(el % 60)} мин`;
    $('ur').style.opacity = lin(t, 2.7, 2.9);
    $('moon').style.opacity = lin(t, 2.1, 2.4) * (1 - lin(t, 5.4, 5.8));
  }
  if (on(t, 6, 9)) {
    const sh = t < 6.4 ? Math.sin(t * 90) * 14 * (1 - lin(t, 6, 6.4)) : 0;
    $('cal').style.transform = `translateX(${sh}px) scale(${mix(.8, 1, back(lin(t, 6, 6.3)))})`;
    $('xline').style.strokeDashoffset = 125 * (1 - eo(lin(t, 6.1, 6.4)));
    rise('l1', t, 6.3, 50, .4); rise('l2', t, 6.45, 50, .4);
  }
  if (on(t, 9, 17)) {
    rise('capF', t, 9.05, 40, .35);
    $('F').style.transform = `translateY(${(1 - eo(lin(t, 9, 9.45))) * 1200}px)`;
    flow(t);
    const s = Math.round(30 * lin(t, 9.4, 16.2));
    $('tm').textContent = `0:${pad(s)}`;
    pop('timer', t, 9.3, .4, .5);
    $('timer').style.background = t >= 16.2 ? 'var(--lime)' : '#F4F4F0';
  }
  if (on(t, 17, 20)) {
    tgIn('tg', t, 17.15);
    rise('clock', t, 17, 30, .3);
    rise('capT', t, 17.4, 40, .4);
  }
  if (on(t, 20, 22)) {
    rise('sh', t, 20.0, 40, .35);
    [20.3, 20.8, 21.3].forEach((t0, i) => { const el = $('st' + (i + 1)); const p = back(lin(t, t0, t0 + .4)); el.style.opacity = t >= t0 ? 1 : 0; el.style.transform = `translateX(${(1 - p) * -120}px)` });
  }
  endAnim(t, 22);
};
render(0);
</script></body></html>
